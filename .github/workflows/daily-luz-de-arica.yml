name: Luz de Arica - generación diaria
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar devocional y versículo
        env:
          DAILY_CONTENT_URL: ${{ secrets.DAILY_CONTENT_URL }}
          DAILY_CONTENT_TOKEN: ${{ secrets.DAILY_CONTENT_TOKEN }}
        run: |
          test -n "$DAILY_CONTENT_URL" || (echo 'Falta DAILY_CONTENT_URL' && exit 1)
          curl -fsS -X POST "$DAILY_CONTENT_URL" -H "Authorization: Bearer $DAILY_CONTENT_TOKEN" -H "Content-Type: application/json" -d '{}'
